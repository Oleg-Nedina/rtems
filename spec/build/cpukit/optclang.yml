  - find-program: null
  - env-assign: AS
  - env-assign: CC
  - set-value: clang++
  - find-program: null
  - env-assign: CXX
  - set-value: llvm-ar
  - substitute: null
  - find-program: null
  - env-assign: AR
  - set-value: clang
  - env-assign: AS
  - env-assign: ASM_NAME
