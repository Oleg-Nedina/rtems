            "threadqextractwithproxy.c",
            "threadqfirst.c",
            "threadqflush.c",
            "threadqgetnameandid.c",
            "threadqops.c",
            "threadqtimeout.c",
            "threadresettimeslice.c",
            "threadrestart.c",
            "threadscheduler.c",
            "threadselfid.c",
            "threadsetstate.c",
            "threadstackallocate.c",
            "threadstackfree.c",
            "threadstart.c",
            "threadstartmultitasking.c",
            "threadtimeout.c",
            "threadunpin.c",
            "threadwaitgetid.c",
            "threadyield.c",
            # Sincronizzazione primitiva, lock ed estensioni utente (15 file)
            "userext.c",
            "userextaddset.c",
            "userextiterate.c",
            "userextremoveset.c",
            "mutex.c",
            "semaphore.c",
            "futex.c",
            "condition.c",
            "allocatormutex.c",
            "apimutexisowner.c",
            "apimutexlock.c",
            "apimutexunlock.c",
            "once.c",
            "freechain.c",
            "hash.c",
            # Scheduler completi e moduli di sistema rimanenti (82 file - FULL SUPERCORE)
            "configstackspacesize.c",
            "debugisthreaddispatchingallowed.c",
            "debugunreachable.c",
            "exceptionmapping.c",
            "interr.c",
            "isr.c",
            "isrisinprogress.c",
            "isrvectortable.c",
            "iterateoverthreads.c",
            "libatomic.c",
            "log2table.c",
            "mpci.c",
            "mpcidefault.c",
