actions:
- set-value: clang
- find-program: null
- env-assign: AS
- env-assign: CC
- set-value: clang++
- find-program: null
- env-assign: CXX
- set-value: llvm-ar
- substitute: null
- find-program: null
- env-assign: AR
- set-value: clang
- env-assign: AS
- env-assign: ASM_NAME
- set-value:
  - -c
  - -o
- env-assign: AS_TGT_F
- set-value:
  - -o
- env-assign: ASLNK_TGT_F
- set-value:
  - --target=${ARCH}-rtems${__RTEMS_MAJOR__}
  - --sysroot=${PREFIX}/${ARCH}-rtems${__RTEMS_MAJOR__}
  - --gcc-toolchain=${PREFIX}
  - -Qunused-arguments
  - -isystem
  - ${PREFIX}/${ARCH}-rtems${__RTEMS_MAJOR__}/include
- substitute: null
- env-append: ABI_FLAGS
- script: |
    import os
    import stat
    import textwrap

    conf.load("ar asm clang clang++ gccdeps")

    arch = conf.env['ARCH']
    arch = arch[0] if isinstance(arch, list) else arch
    major = conf.env['__RTEMS_MAJOR__']
    major = major[0] if isinstance(major, list) else major
    triple = f"{arch}-rtems{major}"
    gxx = f"{triple}-g++"
    gcc = f"{triple}-gcc"

    clang_res = conf.cmd_and_log(conf.env.CC + ['--print-resource-dir']).strip()
    conf.env.append_value('CFLAGS', ['-isystem', f"{clang_res}/include"])
    conf.env.append_value('CXXFLAGS', ['-isystem', f"{clang_res}/include"])

    libstdcxx = conf.cmd_and_log([gxx, '-print-file-name=include/c++']).strip()
    for d in (libstdcxx,
              os.path.join(libstdcxx, triple),
              os.path.join(libstdcxx, 'backward')):
        if os.path.isdir(d):
            conf.env.append_value('CXXFLAGS', ['-isystem', d])

    clang_only_prefixes = ('--target', '--gcc-toolchain', '--sysroot', '-Qunused-arguments')

    compile_only, gcc_safe, skip = [], [], False
    for f in conf.env.ABI_FLAGS:
        if skip:
            compile_only.append(f)
            skip = False
            continue
        if f == '-isystem':
            compile_only.append(f)
            skip = True
            continue
        if f.startswith(clang_only_prefixes):
            compile_only.append(f)
        else:
            gcc_safe.append(f)

    conf.env.ABI_FLAGS = gcc_safe
    conf.env.append_value('CFLAGS', compile_only)
    conf.env.append_value('CXXFLAGS', compile_only)
    conf.env.append_value('ASFLAGS', compile_only)

    conf.env.LINK_CC = [gcc]
    conf.env.LINK_CXX = [gxx]
    conf.env.append_value('LINKFLAGS', ['-qrtems'])


    # Generate the aspis-cc wrapper (PYTHON VERSION + DEBUG IR)

    wrapper_src = textwrap.dedent('''\
        #!/usr/bin/env python3
        import sys
        import os
        import subprocess

        CLANG = "/opt/rtems-llvm/rtems/bin/clang"
        OPT = "/opt/rtems-llvm/rtems/bin/opt"
        PASSES = "/opt/rtems-llvm/ASPIS/build/passes"

        HARDEN_TARGETS = [
            # Famiglia timespec (10 file)
            "timespecisvalid.c",
            "timespecaddto.c",
            "timespecdivide.c",
            "timespecdividebyinteger.c",
            "timespecfromticks.c",
            "timespecgetasnanoseconds.c",
            "timespecisnonnegative.c",
            "timespeclessthan.c",
            "timespecsubtract.c",
            "timespectoticks.c",
            # Famiglia chain (2 file)
            "chain.c",
            "chainnodecount.c",
            # Famiglia rbtree (11 file)
            "rbtreeappend.c",
            "rbtreeextract.c",
            "rbtreeinsert.c",
            "rbtreeiterate.c",
            "rbtreemax.c",
            "rbtreemin.c",
            "rbtreenext.c",
            "rbtreepostorder.c",
            "rbtreeprepend.c",
            "rbtreeprev.c",
            "rbtreereplace.c",
            # Sample workload
            "aspis_sample_hardened/workload.c",
            # Famiglia watchdog (5 file)
            "watchdoginsert.c",
            "watchdogremove.c",
            "watchdogtick.c",
            "watchdogtickssinceboot.c",
            "watchdogtimeslicedefault.c",
            # Moduli core scheduler (4 file)
            "scheduler.c",
            "schedulerpriority.c",
            "schedulersimple.c",
            "schedulerdefaultschedule.c",
            # Famiglia object (24 file)
            "objectactivecount.c",
            "objectallocate.c",
            "objectallocatenone.c",
            "objectallocatestatic.c",
            "objectallocateunlimited.c",
            "objectapimaximumclass.c",
            "objectclose.c",
            "objectextendinformation.c",
            "objectfree.c",
            "objectfreenothing.c",
            "objectfreestatic.c",
            "objectgetinfo.c",
            "objectgetinfoid.c",
            "objectgetlocal.c",
            "objectgetnameasstring.c",
            "objectgetnext.c",
            "objectgetnoprotection.c",
            "objectidtoname.c",
            "objectinitializeinformation.c",
            "objectnamespaceremove.c",
            "objectnametoid.c",
            "objectnametoidstring.c",
            "objectsetname.c",
            "objectshrinkinformation.c",
            # Famiglia core primitive di sincronizzazione (24 file)
            "corebarrier.c",
            "corebarrierwait.c",
            "coremsg.c",
            "coremsgbroadcast.c",
            "coremsgclose.c",
            "coremsgflush.c",
            "coremsgflushwait.c",
            "coremsginsert.c",
            "coremsgseize.c",
            "coremsgsubmit.c",
            "coremsgwkspace.c",
            "coremutexseize.c",
            "corerwlock.c",
            "corerwlockobtainread.c",
            "corerwlockobtainwrite.c",
            "corerwlockrelease.c",
            "coresem.c",
            "coretod.c",
