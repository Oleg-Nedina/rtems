            "processormaskcopy.c",
            "profilingisrentryexit.c",
            "profilingsmplock.c",
            "sched.c",
            "schedulercbs.c",
            "schedulercbsattachthread.c",
            "schedulercbscleanup.c",
            "schedulercbscreateserver.c",
            "schedulercbsdestroyserver.c",
            "schedulercbsdetachthread.c",
            "schedulercbsgetapprovedbudget.c",
            "schedulercbsgetexecutiontime.c",
            "schedulercbsgetparameters.c",
            "schedulercbsgetremainingbudget.c",
            "schedulercbsgetserverid.c",
            "schedulercbsnodeinit.c",
            "schedulercbsreleasejob.c",
            "schedulercbssetparameters.c",
            "schedulercbsunblock.c",
            "schedulerdefaultmakecleansticky.c",
            "schedulerdefaultmappriority.c",
            "schedulerdefaultnodedestroy.c",
            "schedulerdefaultnodeinit.c",
            "schedulerdefaultpinunpin.c",
            "schedulerdefaultpinunpindonothing.c",
            "schedulerdefaultreleasejob.c",
            "schedulerdefaultsetaffinity.c",
            "schedulerdefaultstartidle.c",
            "scheduleredf.c",
            "scheduleredfblock.c",
            "scheduleredfchangepriority.c",
            "scheduleredfnodeinit.c",
            "scheduleredfreleasejob.c",
            "scheduleredfschedule.c",
            "scheduleredfsmp.c",
            "scheduleredfunblock.c",
            "scheduleredfyield.c",
            "schedulergetaffinity.c",
            "schedulerpriorityaffinitysmp.c",
            "schedulerpriorityblock.c",
            "schedulerprioritychangepriority.c",
            "schedulerpriorityschedule.c",
            "schedulerprioritysmp.c",
            "schedulerpriorityunblock.c",
            "schedulerpriorityyield.c",
            "schedulersetaffinity.c",
            "schedulersimpleblock.c",
            "schedulersimplechangepriority.c",
            "schedulersimpleschedule.c",
            "schedulersimplesmp.c",
            "schedulersimpleunblock.c",
            "schedulersimpleyield.c",
            "schedulersmp.c",
            "schedulersmpstartidle.c",
            "schedulerstrongapa.c",
            "smp.c",
            "smpbarrierwait.c",
            "smpbroadcastaction.c",
            "smplock.c",
            "smpmulticastaction.c",
            "smpothercastaction.c",
            "smpsynchronize.c",
            "smpunicastaction.c",
            "tlsallocsize.c",
            # Classic API - Gestione Task, Semafori ed Eventi (10 file)
            "taskcreate.c",
            "taskstart.c",
            "taskdelete.c",
            "tasksuspend.c",
            "taskresume.c",
            "semcreate.c",
            "semobtain.c",
            "semrelease.c",
            "eventsend.c",
            "eventreceive.c",
            # Classic API - Message Queues (11 file)
            "msg.c",
            "msgqbroadcast.c",
            "msgqconstruct.c",
            "msgqcreate.c",
            "msgqdelete.c",
            "msgqflush.c",
            "msgqgetnumberpending.c",
            "msgqident.c",
            "msgqreceive.c",
            "msgqsend.c",
            "msgqurgent.c",
            # Classic API - Rate Monotonic & Timers (12 file)
            "ratemon.c",
            "ratemoncancel.c",
            "ratemoncreate.c",
            "ratemondelete.c",
            "ratemongetstatistics.c",
            "ratemongetstatus.c",
            "ratemonident.c",
            "ratemonperiod.c",
            "ratemonreportstatistics.c",
            "ratemonresetall.c",
            "ratemonresetstatistics.c",
            "ratemontimeout.c",
            # Classic API - Barriere e Partizioni (13 file)
            "barrier.c",
            "barriercreate.c",
            "barrierdelete.c",
            "barrierident.c",
            "barrierrelease.c",
            "barriergetnumwaiting.c",
            "barrierwait.c",
            "part.c",
            "partcreate.c",
            "partdelete.c",
            "partgetbuffer.c",
            "partident.c",
            "partreturnbuffer.c",
            # Classic API - Segnali e Orologio TOD (15 file)
            "signalcatch.c",
            "signalsend.c",
            "clockgetsecondssinceepoch.c",
            "clockgettickssinceboot.c",
            "clockgettickspersecond.c",
            "clockgettod.c",
            "clockgettodtimeval.c",
            "clockgetuptime.c",
            "clockgetuptimenanoseconds.c",
            "clockgetuptimeseconds.c",
            "clockgetuptimetimeval.c",
            "clockset.c",
            "clocktick.c",
            "clocktodtoseconds.c",
            "clocktodvalidate.c",
            # SAPI - Inizializzazione Kernel, Errori e Driver I/O (15 file)
            "exinit.c",
            "exshutdown.c",
            "fatal.c",
            "fatalsrctext.c",
            "panic.c",
            "delaynano.c",
            "delayticks.c",
            "extension.c",
            "extensioncreate.c",
            "extensiondelete.c",
            "extensionident.c",
            "io.c",
            "ioinitialize.c",
            "ioregisterdriver.c",
            "iounregisterdriver.c",
        ]

        args = sys.argv[1:]


        src = next((a for a in args if a.endswith('.c') and not a.startswith('-')), None)


        needs_hardening = any(target in src for target in HARDEN_TARGETS) if src else False
        
        if not needs_hardening:
            os.execv(CLANG, [CLANG] + args)


        out = None
        flags = []
        skip_next = False

        for i, a in enumerate(args):
            if skip_next:
                skip_next = False
                continue
            
            if a in ('-c', '-S'):
                continue
            if a == '-o':
                out = args[i+1]
                skip_next = True
                continue
            if a.startswith('-o') and len(a) > 2:
                out = a[2:]
                continue
            if a in ('-MF', '-MT', '-MQ'):
                skip_next = True
                continue
            if a in ('-MMD', '-MD', '-MP'):
                continue
            if a == src:
                continue
                
            flags.append(a)

        if not out:
            print("[aspis-cc] Errore: flag di output (-o) non trovato.", file=sys.stderr)
            sys.exit(1)

        depfile = out.rsplit('.o', 1)[0] + ".d" if out.endswith('.o') else out + ".d"

       
        def run_cmd(cmd):
            try:
                subprocess.run(cmd, check=True)
            except subprocess.CalledProcessError as e:
                print(f"[aspis-cc] Errore comando: {' '.join(cmd)}", file=sys.stderr)
                sys.exit(e.returncode)


        # DEBUG IR

        src_base = os.path.basename(src)
        tmp = f"/tmp/aspis_debug/{src_base}"
        os.makedirs(tmp, exist_ok=True)

        a_ll = f"{tmp}/a.ll"
        d_ll = f"{tmp}/d.ll"
        e_ll = f"{tmp}/e.ll"


        run_cmd([CLANG] + flags + ['-g', '-MMD', '-MF', depfile, '-emit-llvm', '-S', src, '-o', a_ll])
        run_cmd([OPT, "-passes=simplifycfg,lower-switch", a_ll, "-o", d_ll, "-S"])
        run_cmd([OPT, "-load-pass-plugin", f"{PASSES}/libRASM.so", "-debug-enabled=true", "-passes=rasm-verify", d_ll, "-o", e_ll, "-S"])
        run_cmd([CLANG] + flags + ['-c', e_ll, '-o', out])

        print(f"[aspis-cc] HARDENED {src} -> {out} (IR salvata in {tmp})", file=sys.stderr)
        ''')

    wrapper_path = os.path.join(conf.bldnode.abspath(), 'aspis-cc')
    with open(wrapper_path, 'w') as fp:
        fp.write(wrapper_src)
    os.chmod(wrapper_path, os.stat(wrapper_path).st_mode | stat.S_IEXEC)

    conf.env.CC = [wrapper_path]

