            "pheapgetfreeinfo.c",
            "pheapgetinfo.c",
            "pheapgetsize.c",
            "pheapwalk.c",
            # Sottosistema memoria, stack e workspace (18 file)
            "memoryallocate.c",
            "memorydirtyfreeareas.c",
            "memoryfill.c",
            "memorynoinit.c",
            "memoryzerobeforeuse.c",
            "memoryzerofreeareas.c",
            "stackallocator.c",
            "stackallocatorforidle.c",
            "stackallocatorforidlewkspace.c",
            "stackallocatorfree.c",
            "stackallocatorinit.c",
            "wkspace.c",
            "wkspaceallocate.c",
            "wkspacefree.c",
            "wkspaceisunifieddefault.c",
            "wkspacemallocinitdefault.c",
            "wkspacemallocinitunified.c",
            "wkstringduplicate.c",
            # Sottosistema thread management (43 file)
            "thread.c",
            "threadallocateunlimited.c",
            "threadchangepriority.c",
            "threadclearstate.c",
            "threadcreateidle.c",
            "threaddispatch.c",
