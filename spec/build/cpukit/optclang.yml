            "coretodhookdata.c",
            "coretodhookregister.c",
            "coretodhookrun.c",
            "coretodhookunregister.c",
            "coretodset.c",
            # Gestione della memoria dinamica (19 file)
            "heap.c",
            "heapallocate.c",
            "heapextend.c",
            "heapfree.c",
            "heapgetfreeinfo.c",
            "heapgetinfo.c",
            "heapgreedy.c",
            "heapiterate.c",
            "heapnoextend.c",
            "heapresizeblock.c",
            "heapsizeofuserarea.c",
            "heapwalk.c",
            "pheapallocate.c",
